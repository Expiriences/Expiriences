<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Extremo Oeste | Turismo Cultural</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

/* ================= RESET ================= */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#fff;font-family:Inter;overflow-x:hidden}
img{width:100%;display:block}
a{text-decoration:none;color:inherit}

/* ================= NAV ================= */
nav{
position:fixed;top:0;width:100%;
background:rgba(0,0,0,.6);
backdrop-filter:blur(10px);
z-index:1000;
}
.nav{
display:flex;justify-content:space-between;
padding:20px 40px;
}
.logo{font-family:Oswald;font-size:28px;font-weight:700}

/* ================= HERO ================= */
.hero{
height:100vh;
display:flex;
align-items:center;
padding:0 8%;
background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.8)),
url('https://images.unsplash.com/photo-1512453979798-5ea266f8880c');
background-size:cover;
background-position:center;
}
.hero h1{font-family:Oswald;font-size:5rem}

/* ================= SECTION ================= */
section{padding:100px 8%}
.title{font-family:Oswald;font-size:3rem;margin-bottom:30px}

/* ================= EXPERIENCIAS ================= */
.scroll{
display:flex;
gap:20px;
overflow-x:auto;
scroll-behavior:smooth;
}

.card{
min-width:300px;
background:#111;
cursor:pointer;
border:1px solid rgba(255,255,255,.1);
transition:.3s;
}
.card:hover{transform:scale(1.03)}

.card img{height:200px;object-fit:cover}
.card-content{padding:15px}

/* ================= MODAL ================= */
.modal{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.85);
z-index:9999;
padding:20px;
}

.modal.active{display:flex;animation:fade .3s}

@keyframes fade{
from{opacity:0;transform:scale(.9)}
to{opacity:1;transform:scale(1)}
}

.modal-box{
background:#111;
padding:30px;
max-width:600px;
width:100%;
border:1px solid rgba(255,255,255,.1);
position:relative;
}

.close{
position:absolute;
top:10px;
right:15px;
font-size:25px;
cursor:pointer;
color:#d77c4a;
}

/* ================= WHATSAPP ================= */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:14px 18px;
border-radius:50px;
font-weight:bold;
color:black;
}

@media(max-width:768px){
.hero h1{font-size:3rem}
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
<div class="nav">
<div class="logo">Extremo Oeste</div>
</div>
</nav>

<!-- HERO -->
<section class="hero">
<div>
<h1>Descubre Lima</h1>
<p>Turismo cultural alternativo</p>
</div>
</section>

<!-- EXPERIENCIAS -->
<section>
<h2 class="title">Experiencias</h2>

<div class="scroll">

<div class="card" data-title="Lima Precolombina" data-text="Huacas milenarias y arqueología urbana." data-price="$65">
<img src="https://images.unsplash.com/photo-1589909202802-8f4aadce1849">
<div class="card-content">
<h3>Lima Precolombina</h3>
</div>
</div>

<div class="card" data-title="Mercado Central" data-text="Gastronomía local." data-price="$55">
<img src="https://images.unsplash.com/photo-1523906834658-6e24ef2386f9">
<div class="card-content">
<h3>Mercado Central</h3>
</div>
</div>

<div class="card" data-title="Barranco Nocturno" data-text="Arte urbano y vida nocturna." data-price="$45">
<img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390">
<div class="card-content">
<h3>Barranco Nocturno</h3>
</div>
</div>

</div>
</section>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-box">
<span class="close" onclick="closeModal()">×</span>

<h2 id="m-title"></h2>
<p id="m-text"></p>
<p id="m-price"></p>

</div>
</div>

<!-- WHATSAPP -->
<a class="whatsapp" id="wa" target="_blank">WhatsApp</a>

<script>

/* ================= CONFIG ================= */
const WHATSAPP_NUMBER = "51987654321";

/* ================= MODAL ================= */
const modal = document.getElementById("modal");

document.querySelectorAll(".card").forEach(card=>{
card.addEventListener("click",()=>{
document.getElementById("m-title").innerText = card.dataset.title;
document.getElementById("m-text").innerText = card.dataset.text;
document.getElementById("m-price").innerText = card.dataset.price;

modal.classList.add("active");
});
});

function closeModal(){
modal.classList.remove("active");
}

window.addEventListener("click",(e)=>{
if(e.target === modal) closeModal();
});

document.addEventListener("keydown",(e)=>{
if(e.key==="Escape") closeModal();
});

/* ================= WHATSAPP ================= */
document.getElementById("wa").href =
"https://wa.me/" + WHATSAPP_NUMBER;

</script>

</body>
</html>
